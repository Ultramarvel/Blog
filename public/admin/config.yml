locale: zh_Hans

backend:
  name: github
  repo: Ultramarvel/Blog
  branch: master
  auth_scope: public_repo
  site_domain: aesthetic-selkie-0b6598.netlify.app
  base_url: https://api.netlify.com
  auth_endpoint: auth

site_url: https://blog-of-qyd.xyz
display_url: https://blog-of-qyd.xyz

local_backend: true
publish_mode: editorial_workflow

# Decap CMS 要求声明媒体目录；后台字段和 Markdown 工具栏均未开放图片功能。
media_folder: "public/.cms-media-disabled"
public_folder: "/.cms-media-disabled"

collections:
  - name: "profile"
    label: "博客主人"
    files:
      - name: "owner"
        label: "观察者档案"
        file: "src/content/profile.md"
        fields:
          - { label: "姓名", name: "name", widget: "string" }
          - { label: "头像文字", name: "initials", widget: "string", hint: "显示在动态星球中心，建议 1–3 个字符" }
          - { label: "首页卡片姓名", name: "cardName", widget: "string", default: "Yudong" }
          - { label: "首页卡片身份", name: "cardRoles", widget: "list", field: { label: "身份", name: "role", widget: "string" } }
          - { label: "身份", name: "role", widget: "string" }
          - { label: "主标题", name: "tagline", widget: "string" }
          - { label: "首页短介绍", name: "shortBio", widget: "text" }
          - { label: "所在地", name: "location", widget: "string" }
          - { label: "坐标", name: "coordinates", widget: "string" }
          - { label: "当前状态", name: "status", widget: "string" }
          - { label: "最近在做", name: "current", widget: "list", field: { label: "事项", name: "item", widget: "string" } }
          - { label: "写作主题", name: "topics", widget: "list", field: { label: "主题", name: "topic", widget: "string" } }
          - { label: "开始年份", name: "since", widget: "string" }
          - { label: "联系邮箱", name: "email", widget: "string" }
          - { label: "档案编号", name: "profileNumber", widget: "string" }
          - { label: "更新时间", name: "updatedAt", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
          - label: "完整介绍"
            name: "body"
            widget: "markdown"
            modes: ["raw"]
            buttons: ["bold", "italic", "code", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
            editor_components: ["code-block"]
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "src/content/posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} · {{publishedAt}}"
    sortable_fields: ["publishedAt", "title", "category"]
    view_filters:
      - { label: "草稿", field: "draft", pattern: true }
      - { label: "已发布", field: "draft", pattern: false }
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "摘要", name: "summary", widget: "text" }
      - { label: "分类", name: "category", widget: "string", default: "随笔" }
      - { label: "发布日期", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "阅读分钟", name: "readingMinutes", widget: "number", value_type: "int", min: 1, default: 5 }
      - { label: "首页推荐", name: "featured", widget: "boolean", default: false }
      - { label: "保存为草稿", name: "draft", widget: "boolean", default: true }
      - { label: "作者", name: "author", widget: "string", default: "林" }
      - { label: "写作地点", name: "location", widget: "string", default: "上海" }
      - { label: "笔记编号", name: "noteNumber", widget: "string", required: false }
      - label: "正文"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        buttons: ["bold", "italic", "code", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["code-block"]
